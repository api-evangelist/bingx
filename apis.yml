aid: bingx
name: BingX
image: https://static-app.bb-os.com/fe-common/assets/share_card.png?v=20240123
description: BingX is a cryptocurrency exchange offering spot, perpetual futures (USDT-M and Coin-M), copy trading and wealth
  products. It exposes a public REST trading API at open-api.bingx.com and WebSocket market data streams, authenticated with
  an API key header and HMAC SHA256 request signatures.
